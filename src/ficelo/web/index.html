<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ficelo</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/icons/icon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/icons/icon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/file-icons.css">
<link rel="stylesheet" href="/markdown.css">
<link rel="stylesheet" href="/reading-background.css">
<link rel="stylesheet" href="/review.css">
<link rel="stylesheet" href="/vendor/monaco/vs/editor/editor.main.css">
</head>
<body>
  <header class="bar">
    <div class="bar-row">
      <div class="header-navigation">
        <img class="brand" src="/icons/icon-32.png" srcset="/icons/icon-64.png 2x, /icons/icon-128.png 3x" alt="ficelo" width="22" height="22">
        <nav id="crumbs" class="crumbs" aria-label="Current folder"></nav>
        <button id="copyPath" class="icon" title="Copy this folder's full path" aria-label="Copy path"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5.2" y="5.2" width="8" height="8" rx="1.4"/><path d="M10.8 3.2H3.6a1.4 1.4 0 0 0-1.4 1.4v7.2"/></svg></button>
      </div>
      <div class="header-actions">
        <div class="control-group folder-controls" role="group" aria-label="Folder navigation">
          <button id="folderBack" class="icon" title="Go to previous folder" aria-label="Go to previous folder" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h14"/></svg></button>
          <button id="folderForward" class="icon" title="Go to next folder" aria-label="Go to next folder" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 5 7 7-7 7M5 12h14"/></svg></button>
          <button id="homeButton" class="icon" title="Go to Home folder" aria-label="Home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h5v-7h4v7h5V9"/></svg>
          </button>
        </div>
        <button id="reopenTab" class="icon" title="Reopen the last closed tab  Alt+Shift+W">↶</button>
        <div class="finder session-picker">
          <div class="control-group session-controls" role="group" aria-label="Session">
            <button id="sessionsButton" class="ghost" title="Switch to a previous session">Sessions</button>
            <button id="newSession" class="ghost" title="Close every open file and start a new session; this one stays in Sessions">New</button>
            <button id="starSession" class="icon" title="Star this session to keep it and sort it to the top">☆</button>
            <input id="sessionName" class="path session-name-input" spellcheck="false" autocomplete="off"
                   placeholder="Name this session" aria-label="Session name"
                   title="Name this session — shown here, in Sessions, and in the page title">
          </div>
          <div id="sessionList" class="results sessions-list" hidden></div>
        </div>
        <button id="terminalButton" class="icon" title="Open terminal" hidden>›_</button>
        <button id="settingsToggle" class="icon" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="explorer-bar">
        <label class="explorer-hidden" title="Show hidden files">
          <input id="showHiddenFiles" type="checkbox" aria-label="Show hidden files" checked disabled>
          <span>Show hidden files</span>
        </label>
        <button id="newFile" class="mini" title="New file">+F</button>
        <button id="newFolder" class="mini" title="New folder">+D</button>
      </div>
      <div id="modeSwitch" class="segmented mode-switch">
        <button class="seg" data-mode="files" aria-pressed="true">Files</button>
        <button class="seg" data-mode="review">Review</button>
      </div>
      <div id="fileSearch" class="explorer-search">
        <input id="search" class="search" spellcheck="false" autocomplete="off"
               placeholder="Find a file or folder…" aria-label="Find a file or folder"
               title="Search this folder or enter a path, including ~.">
        <button id="clearSearch" class="icon" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <div id="results" class="results explorer-results" hidden></div>
      <ul id="tree" class="tree" aria-label="Files"></ul>
      <div id="review" class="review" hidden></div>
    </nav>
    <div id="treeResize" class="panel-resize" aria-label="File tree width" aria-controls="sidebar"></div>

    <div class="panel">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div class="stage">
        <div id="editorHost" class="editor-host" hidden></div>
        <div id="viewerHost" class="viewer-host" hidden></div>
        <div id="diffHost" class="diff-host" hidden></div>
        <div id="previewHost" class="preview-host" hidden>
          <div id="preview" class="preview-scroll">
            <article id="markdownContent" class="markdown"></article>
          </div>
          <div id="contentsResize" class="panel-resize" aria-label="Contents width" aria-controls="tocPane" hidden></div>
          <aside id="tocPane" class="toc-pane" hidden>
            <div class="toc-head">
              <span class="toc-title">Contents</span>
              <button id="tocHide" class="mini" title="Hide contents">✕</button>
            </div>
            <nav id="toc" class="toc"></nav>
          </aside>
        </div>
        <div id="notice" class="notice">Loading…</div>
        <div id="minimapResize" class="panel-resize minimap-resize" aria-label="Minimap width" aria-controls="editorHost" hidden></div>
        <div id="fileActions" role="group" aria-label="File controls" hidden>
          <button id="scrollFileTop" class="file-action" title="Go to top" aria-label="Go to top" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14M12 20V8m-6 6 6-6 6 6"/></svg>
          </button>
          <button id="reloadFile" class="file-action" title="Reload this file from disk  Alt+R" aria-label="Reload file" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 8"/><path d="M19 3v5h-5"/></svg>
          </button>
          <button id="scrollFileBottom" class="file-action" title="Go to bottom" aria-label="Go to bottom" hidden>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20h14M12 4v12m-6-6 6 6 6-6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <button id="sidebarToggle" class="ghost" title="Hide file tree" aria-controls="sidebar" aria-pressed="true" aria-expanded="true">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 5 5-5 5m5-10 5 5-5 5"/></svg>
      File tree
    </button>
    <span id="mode" class="badge" title="Whether this server will save changes"></span>
    <span id="sbPath" class="sb-path"><span id="sbDir" class="sb-dir"></span><span id="sbName" class="sb-name"></span></span>
    <span class="spacer"></span>
    <div id="viewToggle" class="segmented" hidden></div>
    <button id="tocToggle" class="ghost" title="Hide contents" aria-controls="tocPane" hidden>
      <span>Contents</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 3 5 5-5 5m5-10 5 5-5 5"/></svg>
    </button>
    <div id="diffLayout" class="segmented" hidden>
      <button class="seg" data-layout="side">Split</button>
      <button class="seg" data-layout="inline">Unified</button>
      <button id="diffMap" class="seg" title="Show the overview map">Map</button>
    </div>
    <span id="sbKind" class="sb-item"></span>
    <span id="sbSize" class="sb-item"></span>
  </footer>

  <div id="settings" class="settings" hidden></div>
  <div id="flash" class="flash" hidden></div>

  <!-- marked first, deliberately: Monaco's loader installs a global `define`,
       and marked's UMD build would register as an AMD module instead of
       setting window.marked if it saw one. -->
  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/highlight/highlight.min.js"></script>
  <script src="/vendor/highlight/dockerfile.min.js"></script>
  <script src="/vendor/monaco/vs/loader.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
