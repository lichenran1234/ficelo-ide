[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution, command and import name are all `ficelo`. Nothing installs
# this from PyPI yet.
name = "ficelo"
version = "0.1.0.dev0"
description = "A web file browser, markdown reader and diff viewer. Python standard library only."
readme = "README.md"
requires-python = ">=3.9"
# LICENSE covers ficelo; NOTICE and the bundled licence files cover dependencies.
# A distribution-wide SPDX expression must account for all of those terms.
license-files = [
    "LICENSE",
    "NOTICE",
    "src/ficelo/web/vendor/**/LICENSE*",
    "src/ficelo/web/vendor/monaco/ThirdPartyNotices.txt",
    "src/ficelo/web/vendor/licenses/*.txt",
    "src/ficelo/web/vendor/licenses/ELK-SOURCE.md",
]
keywords = ["file browser", "markdown", "editor", "diff", "remote development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Utilities",
]

# No dependencies, and this list stays empty. It is the reason the project
# exists: one command, no pip resolution, no build step, works offline. The
# frontend libraries are vendored under web/vendor/ rather than fetched.
dependencies = []

[project.scripts]
ficelo = "ficelo.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The frontend ships inside the package so an installed ficelo can find it
# with a path relative to __file__, rather than guessing at a data dir.
ficelo = ["web/*", "web/**/*"]
